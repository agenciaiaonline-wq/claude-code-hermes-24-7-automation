services:
  postgres:
    image: postgres:16-alpine
    container_name: agency_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agency_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-agency_core}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agency_admin} -d ${POSTGRES_DB:-agency_core}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agency_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change-me-strong-redis-password}"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change-me-strong-redis-password} ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: agency_n8n
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-agency_core}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-agency_admin}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-change-me-strong-postgres-password}
      - DB_POSTGRESDB_SCHEMA=public
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me-32-char-random-encryption-key}
      - EXECUTIONS_MODE=regular
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://n8n.your-domain.example.com/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - N8N_METRICS=false
      - N8N_HIRING_BANNER_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"

  waha:
    image: devlikeapro/waha:latest
    container_name: agency_waha
    restart: always
    environment:
      - WAHA_ZIP_LOGS=false
      - WHATSAPP_HOOK_URL=http://n8n:5678/webhook/waha-inbound
      - WHATSAPP_HOOK_EVENTS=message,message.any,session.status
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-change-me-strong-waha-password}
      - WAHA_API_KEY=${WAHA_API_KEY:-change-me-strong-waha-api-key}
    volumes:
      - waha_sessions:/app/.sessions
    ports:
      - "127.0.0.1:3000:3000"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agency_qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

volumes:
  pg_data:
  redis_data:
  n8n_data:
  waha_sessions:
  qdrant_data:
